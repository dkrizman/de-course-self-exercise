version: 2

models:
  - name: stg_github_events
    description: "Staging table for GitHub events with actor and repository attributes."
    columns:
      - name: source_event_id
        data_tests:
          - unique
          - not_null

      - name: event_type
        data_tests:
          - not_null

      - name: event_created_at
        data_tests:
          - not_null