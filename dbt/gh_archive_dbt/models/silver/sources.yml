version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: github_events

models:
  - name: stg_github_events
    columns:
      - name: source_event_id
        data_tests:
          - unique
          - not_null

      - name: event_type
        data_tests:
          - not_null

      - name: event_created_at
        data_tests:
          - not_null

  - name: silver_github_events
    description: "Flattened GitHub events with actor and repository attributes."

    columns:
      - name: source_event_id
        data_tests:
          - unique
          - not_null

      - name: event_type
        data_tests:
          - not_null

      - name: event_created_at
        data_tests:
          - not_null

      - name: actor_login
        data_tests:
          - not_null

      - name: repo_name
        data_tests:
          - not_null